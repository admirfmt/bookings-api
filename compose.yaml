services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: bookings_user
      POSTGRES_PASSWORD: bookings_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings_user -d bookings_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    
    environment:
      PORT: 3000
      INSTANCE_NAME: api-1
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bookings_db
      DB_USER: bookings_user
      DB_PASSWORD: bookings_password
    depends_on:
      db:
        condition: service_healthy

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    
    environment:
      PORT: 3000
      INSTANCE_NAME: api-2
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bookings_db
      DB_USER: bookings_user
      DB_PASSWORD: bookings_password
    depends_on:
      db:
        condition: service_healthy

  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    
    environment:
      PORT: 3000
      INSTANCE_NAME: api-3
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bookings_db
      DB_USER: bookings_user
      DB_PASSWORD: bookings_password
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  pgdata: